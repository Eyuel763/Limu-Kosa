version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: limu-kosa-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=limu_kosa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./limu-kosa-api
      dockerfile: Dockerfile
    container_name: limu-kosa-api
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/limu_kosa?schema=public
      - PORT=4000
      - JWT_SECRET=change-this-secret-key-12345
      - CORS_ORIGIN=http://localhost:3000,http://127.0.0.1:3000
      - UPLOAD_DIR=uploads
    ports:
      - "4000:4000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./limu-kosa
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:4000/api
    container_name: limu-kosa-web
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  uploads_data:
